<!doctype html>
<meta charset="utf-8">
<title>live sound check</title>
<iframe id="app" src="../index.html" style="width:1000px;height:640px;border:0"></iframe>
<pre id="out">pending</pre>
<script type="module">
// Runs the real page, with the real physics worker, and checks the sound wiring end to end.
const report = (text) => {
  document.getElementById('out').textContent = text;
  if (location.search.includes('report')) fetch('/result', { method: 'POST', body: text });
};
const wait = (ms) => new Promise((r) => setTimeout(r, ms));

try {
  const frame = document.getElementById('app');
  await new Promise((r) => { frame.onload = r; });
  const win = frame.contentWindow, doc = frame.contentDocument;
  for (let i = 0; i < 100 && !(win.__jelly && doc.getElementById('loading').hidden); i++) await wait(100);
  const j = win.__jelly;
  const lines = [];
  const check = (name, ok, detail = '') => { lines.push(`${ok ? 'PASS' : 'FAIL'}  ${name}  ${detail}`); if (!ok) failed++; };
  let failed = 0;
  const canvas = doc.getElementById('view');
  const box = canvas.getBoundingClientRect();
  const cx = box.left + box.width / 2, cy = box.top + box.height * 0.45;
  const ev = (type, x, y) => canvas.dispatchEvent(new win.PointerEvent(type, {
    clientX: x, clientY: y, button: 0, buttons: 1, pointerId: 1, pointerType: 'mouse', bubbles: true,
  }));

  await j.drive(1500);
  check('no sound before first input', !j.audio, '(browser autoplay rule)');

  // First input unlocks audio. Tap away from the jelly so this doesn't count as a poke.
  ev('pointerdown', box.left + 5, box.top + 5);
  ev('pointerup', box.left + 5, box.top + 5);
  await wait(200);
  const a = j.audio;
  check('first input starts audio', !!a && a.ctx.state === 'running', a ? `state=${a.ctx.state}` : 'no audio object');

  // Listen at the master bus and count what the page triggers.
  const counts = { blub: 0, poke: 0, grab: 0, release: 0, peel: 0, bump: 0 };
  for (const name of Object.keys(counts)) {
    const original = a[name].bind(a);
    a[name] = (...args) => { if (name !== 'peel' || args[0] > 0) counts[name]++; return original(...args); };
  }
  const analyser = a.ctx.createAnalyser();
  analyser.fftSize = 2048;
  a.master.connect(analyser);
  const buf = new Float32Array(analyser.fftSize);
  let loudest = 0;
  const listen = setInterval(() => {
    analyser.getFloatTimeDomainData(buf);
    for (const v of buf) loudest = Math.max(loudest, Math.abs(v));
  }, 20);
  const measure = async (ms) => { loudest = 0; await j.drive(ms); return loudest; };

  // The jelly drops onto the plate at load and really does ring for several seconds, audibly.
  const settling = await measure(800);
  await j.drive(7000);
  const blubsSettled = counts.blub;
  const quiet = await measure(2000);
  check('quiet once settled', quiet < 0.002 && counts.blub === blubsSettled, `peak ${quiet.toFixed(5)} (was ${settling.toFixed(4)} while still ringing), ${counts.blub - blubsSettled} blubs`);

  ev('pointerdown', cx, cy); ev('pointerup', cx, cy);
  const pokePeak = await measure(1800);
  check('click plays poke', counts.poke === 1, `poke x${counts.poke}`);
  check('poke makes the jelly wobble audibly', counts.blub >= 2 && pokePeak > 0.05, `blub x${counts.blub}, peak ${pokePeak.toFixed(3)}`);

  ev('pointerdown', cx, cy);
  const pull = j.drive(900);
  for (let i = 1; i <= 25; i++) { ev('pointermove', cx + i * 7, cy - i * 4); await wait(16); }
  await pull;
  check('drag plays grab', counts.grab === 1, `grab x${counts.grab}`);
  const blubsBefore = counts.blub;
  ev('pointerup', cx + 175, cy - 100);
  const relPeak = await measure(2000);
  check('release plays schlop', counts.release === 1 && relPeak > 0.1, `release x${counts.release}, peak ${relPeak.toFixed(3)}`);
  check('wobble follows release', counts.blub > blubsBefore, `${counts.blub - blubsBefore} blubs`);
  check('nothing clips', relPeak <= 1, `peak ${relPeak.toFixed(3)}`);

  doc.getElementById('bump').click();
  const bumpPeak = await measure(600);
  check('bump button plays', counts.bump === 1 && bumpPeak > 0.05, `peak ${bumpPeak.toFixed(3)}`);

  const button = doc.getElementById('sound');
  button.click();
  await wait(150);
  check('mute button updates', button.textContent === 'Sound off' && button.getAttribute('aria-pressed') === 'false', `"${button.textContent}"`);
  doc.getElementById('bump').click();
  const mutedPeak = await measure(500);
  check('mute silences hits', mutedPeak < 0.005, `peak ${mutedPeak.toFixed(5)}`);
  button.click();
  check('unmute restores', button.textContent === 'Sound on');
  win.localStorage.removeItem('jelly-muted');

  clearInterval(listen);
  check('physics still running', Number.isFinite(j.simRate) && j.simRate > 0.5, `sim rate ${j.simRate.toFixed(2)}`);
  check('no page error', !doc.getElementById('error').textContent, doc.getElementById('error').textContent);
  lines.push(`peel events during all that: ${counts.peel}`);
  report(`${failed ? 'FAILED' : 'DONE'}\n${lines.join('\n')}`);
} catch (err) {
  report(`ERROR: ${err && err.stack || err}`);
}
</script>
<script>
addEventListener('unhandledrejection', (e) => { if (location.search.includes('report')) fetch('/result', { method: 'POST', body: 'ERROR: ' + e.reason }); });
</script>
