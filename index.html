<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jelly</title>
<style>
  :root { color-scheme: dark; --ink: #f4ebe4; --dim: rgba(244, 235, 228, 0.58); --accent: #e0344f; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #0b0807; overflow: hidden;
    font: 13px/1.35 ui-sans-serif, system-ui, "Segoe UI", sans-serif; color: var(--ink); }
  #view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  .panel { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); width: min(560px, calc(100vw - 28px));
    padding: 14px 18px 13px; border-radius: 16px; background: rgba(20, 14, 12, 0.62);
    backdrop-filter: blur(16px) saturate(1.3); -webkit-backdrop-filter: blur(16px) saturate(1.3);
    border: 1px solid rgba(255, 240, 230, 0.09); }
  .row { display: flex; align-items: center; gap: 12px; }
  .ends { font-size: 12px; color: var(--dim); white-space: nowrap; }
  input[type=range] { -webkit-appearance: none; appearance: none; flex: 1; min-width: 0; height: 24px; background: transparent; margin: 0; cursor: pointer; }
  input[type=range]::-webkit-slider-runnable-track { height: 5px; border-radius: 3px;
    background: linear-gradient(90deg, var(--accent) var(--p, 55%), rgba(255, 240, 230, 0.16) var(--p, 55%)); }
  input[type=range]::-moz-range-track { height: 5px; border-radius: 3px; background: rgba(255, 240, 230, 0.16); }
  input[type=range]::-moz-range-progress { height: 5px; border-radius: 3px; background: var(--accent); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 20px; height: 20px; margin-top: -7.5px; border-radius: 50%;
    background: #fff4ee; border: 0; box-shadow: 0 1px 6px rgba(0, 0, 0, 0.5); }
  input[type=range]::-moz-range-thumb { width: 20px; height: 20px; border-radius: 50%; background: #fff4ee; border: 0; }
  input[type=range]:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 6px; }
  .meta { margin-top: 8px; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
  .readout { font-variant-numeric: tabular-nums; color: var(--dim); font-size: 12px; }
  .readout b { color: var(--ink); font-weight: 600; }
  button { font: inherit; font-size: 12px; color: var(--ink); background: rgba(255, 240, 230, 0.09); border: 1px solid rgba(255, 240, 230, 0.12);
    border-radius: 9px; padding: 5px 11px; cursor: pointer; }
  button:hover { background: rgba(255, 240, 230, 0.16); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .btns { display: flex; gap: 6px; margin-left: auto; }
  .colors { margin-bottom: 12px; }
  .color-options { display: flex; flex-wrap: wrap; gap: 6px; }
  .color-choice { display: inline-flex; align-items: center; gap: 6px; padding: 4px 8px; }
  .color-choice::before { content: ''; width: 9px; height: 9px; border-radius: 50%; background: var(--swatch, var(--accent)); }
  .color-choice[aria-pressed=true] { border-color: var(--swatch); background: rgba(255, 240, 230, 0.16); font-weight: 600; }
  #hud { position: fixed; top: 14px; left: 16px; color: var(--dim); font-size: 11.5px; font-variant-numeric: tabular-nums; pointer-events: none; line-height: 1.55; }
  #hint { position: fixed; top: 14px; right: 16px; text-align: right; color: var(--dim); font-size: 12px; line-height: 1.55; pointer-events: none; transition: opacity 0.6s; }
  #hint.gone { opacity: 0.45; }
  #hint b { color: var(--ink); font-weight: 600; }
  #loading, #error { position: fixed; left: 50%; top: 45%; transform: translate(-50%, -50%); color: var(--dim); }
  #error { color: #ffb4a8; max-width: 80vw; text-align: center; }
  @media (max-width: 560px) { #hint { display: none; } }
</style>
</head>
<body>
<canvas id="view" aria-label="Interactive jelly simulation. Drag the jelly to pull it, click it to poke it."></canvas>
<div id="loading">Casting the jelly…</div>
<div id="error" hidden></div>
<div id="hud"><div id="stats"></div><div id="perf"></div></div>
<div id="hint"><b>Click</b> to poke · <b>Drag</b> to pull<br>Drag the background to orbit · Scroll to zoom</div>
<div class="panel">
  <div class="row colors" role="group" aria-label="Jelly color">
    <span class="ends">Color</span>
    <div class="color-options">
      <button class="color-choice" data-color="red" aria-pressed="true">Red</button>
      <button class="color-choice" data-color="blue" aria-pressed="false">Blue</button>
      <button class="color-choice" data-color="green" aria-pressed="false">Green</button>
      <button class="color-choice" data-color="purple" aria-pressed="false">Purple</button>
      <button class="color-choice" data-color="gold" aria-pressed="false">Gold</button>
    </div>
  </div>
  <div class="row">
    <span class="ends">Firm</span>
    <input id="intensity" type="range" min="0" max="100" value="55" aria-label="Jiggle intensity, from firm to very wobbly">
    <span class="ends">Very wobbly</span>
  </div>
  <div class="row meta">
    <div class="readout">Stiffness <b id="modulus">–</b> &nbsp; Wobble <b id="freq">–</b></div>
    <div class="btns"><button id="sound" title="M" aria-pressed="true">Sound on</button><button id="bump" title="Spacebar">Bump table</button><button id="reset" title="R">Reset</button></div>
  </div>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
